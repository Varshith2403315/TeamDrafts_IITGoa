<h1>DoseTwin: system architecture</h1>
<p class="sub">Personal glucose–insulin digital twin for type 1 diabetes on insulin pens. Solid boxes run in deployment; the dashed band is the in-silico evaluation harness.</p>
<svg viewBox="0 0 1060 560" width="100%">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5a6b79"/></marker></defs>
<!-- inputs -->
<text x="20" y="22" font-size="13" font-weight="bold" fill="#5a6b79">DATA SOURCES</text>
<g font-size="13">
<rect x="20" y="34" width="190" height="44" rx="8" fill="#fbfcfd" stroke="#dbe2e8"/><text x="32" y="61">CGM (5-min glucose)</text>
<rect x="20" y="88" width="190" height="44" rx="8" fill="#fbfcfd" stroke="#dbe2e8"/><text x="32" y="115">Smart pen (doses)</text>
<rect x="20" y="142" width="190" height="44" rx="8" fill="#fbfcfd" stroke="#dbe2e8"/><text x="32" y="169">Meal / carb log</text>
<rect x="20" y="196" width="190" height="44" rx="8" fill="#fbfcfd" stroke="#dbe2e8"/><text x="32" y="223">Phone steps</text>
<rect x="20" y="250" width="190" height="56" rx="8" fill="#e6ecfb" stroke="#1f4fd1"/><text x="32" y="273">Synthetic EHR</text><text x="32" y="292" font-size="11" fill="#5a6b79">Dx, labs (HbA1c), HLA, Rx</text>
</g>
<!-- ingestion -->
<rect x="250" y="34" width="150" height="272" rx="10" fill="#fbfcfd" stroke="#dbe2e8"/>
<text x="262" y="60" font-size="13" font-weight="bold">Ingestion</text>
<text x="262" y="84" font-size="11.5">Align to 1-min grid</text><text x="262" y="104" font-size="11.5">Units, gaps, IOB/COB</text><text x="262" y="124" font-size="11.5">Steps → activity</text><text x="262" y="144" font-size="11.5">(tracker.py)</text>
<line x1="210" y1="170" x2="248" y2="170" stroke="#5a6b79" stroke-width="2" marker-end="url(#a)"/>
<!-- twin -->
<rect x="440" y="34" width="330" height="272" rx="12" fill="#14202b"/>
<text x="458" y="62" font-size="14" font-weight="bold" fill="#8fb0ff">PERSONAL TWIN</text>
<text x="458" y="88" font-size="12" fill="#f5f7f9">10-state extended Bergman model (model.py)</text>
<text x="458" y="108" font-size="11.5" fill="#b9c6d2">SC insulin · carb absorption · activity · dawn · d(t)</text>
<rect x="458" y="122" width="294" height="54" rx="8" fill="#1c2b38"/><text x="470" y="144" font-size="12" fill="#f5f7f9">1. EHR prior: CF, CR, weight, HbA1c;</text><text x="470" y="164" font-size="12" fill="#f5f7f9">   1 U drop = CF, CR-covered meal = 0</text>
<rect x="458" y="184" width="294" height="54" rx="8" fill="#1c2b38"/><text x="470" y="206" font-size="12" fill="#f5f7f9">2. MAP fit: 5–300 min forecast error,</text><text x="470" y="226" font-size="12" fill="#f5f7f9">   soft-L1 + prior (identify.py, ~1.3 s)</text>
<rect x="458" y="246" width="294" height="48" rx="8" fill="#1c2b38"/><text x="470" y="275" font-size="12" fill="#f5f7f9">3. CGM observer keeps the twin in sync</text>
<line x1="400" y1="170" x2="438" y2="170" stroke="#5a6b79" stroke-width="2" marker-end="url(#a)"/>
<!-- outputs -->
<rect x="810" y="34" width="230" height="124" rx="10" fill="#fbfcfd" stroke="#c23030"/>
<text x="824" y="60" font-size="13" font-weight="bold" fill="#c23030">Predicted-low alert</text>
<text x="824" y="84" font-size="11.5">mean(twin 40-min min,</text><text x="824" y="102" font-size="11.5">30-min CGM trend) &lt; 65</text><text x="824" y="126" font-size="11.5">→ eat 15 g now (alerts.py)</text>
<rect x="810" y="182" width="230" height="124" rx="10" fill="#fbfcfd" stroke="#1f4fd1"/>
<text x="824" y="208" font-size="13" font-weight="bold" fill="#1f4fd1">Dose advisor</text>
<text x="824" y="232" font-size="11.5">simulate 0..cap U, 0.5 U steps, 5 h</text><text x="824" y="250" font-size="11.5">reject if forecast − margin &lt; 70</text><text x="824" y="268" font-size="11.5">pick min Kovatchev risk</text><text x="824" y="288" font-size="11.5">(advisor.py)</text>
<line x1="770" y1="110" x2="808" y2="96" stroke="#5a6b79" stroke-width="2" marker-end="url(#a)"/>
<line x1="770" y1="230" x2="808" y2="244" stroke="#5a6b79" stroke-width="2" marker-end="url(#a)"/>
<!-- delivery -->
<rect x="440" y="330" width="600" height="56" rx="10" fill="#e6ecfb" stroke="#1f4fd1"/>
<text x="456" y="354" font-size="13" font-weight="bold">Delivery</text><text x="456" y="374" font-size="11.5">Phone: alerts + dose · Clinician dashboard: triage, settings replay on twin</text>
<line x1="925" y1="306" x2="925" y2="328" stroke="#5a6b79" stroke-width="2" marker-end="url(#a)"/>
<!-- eval harness -->
<rect x="20" y="410" width="1020" height="136" rx="12" fill="none" stroke="#8794a1" stroke-dasharray="6 5"/>
<text x="36" y="436" font-size="13" font-weight="bold" fill="#5a6b79">IN-SILICO EVALUATION HARNESS (not part of deployment)</text>
<text x="36" y="460" font-size="11.5">Hidden truth: UVA/Padova T1D model, 30 virtual patients (uva_padova.py; parity vs simglucose &lt;0.5 mg/dL)</text>
<text x="36" y="480" font-size="11.5">Life simulator: Indian meal timing, carb-count bias + 30% error, missed/late boluses, mis-set clinic settings, walks, CGM noise (cohort.py)</text>
<text x="36" y="500" font-size="11.5">Protocol: dev cohort (seed 7) for tuning + LightGBM baseline; held-out seeds 2026–2028; days 1–7 run-in, days 8–14 paired arms A–E</text>
<text x="36" y="520" font-size="11.5">Outputs: results/study.json, CSVs, figures — bootstrap CIs, Wilcoxon tests (run_study.py, ~15 min CPU)</text>
</svg>
</body></html>
